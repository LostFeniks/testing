<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Validator</title>
</head>
<body>
    <div class="innogrn-form-widget">
        <div class="card-icons"></div>
        <form>
            <div class="input-group">
                <input type="text" class="input" placeholder="Введите номер карты" maxlength="19" autocomplete="off">
                <button type="submit" class="submit">Проверить</button>
            </div>
            <div class="result info">Введите номер карты для проверки</div>
        </form>
    </div>
</body>
</html>
